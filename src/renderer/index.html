<!doctype html>
<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <title>Gezinsbudget</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <style>
      body {
        margin: 0;
        background: #f4f6fb;
        font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      }
      .bootSplash {
        display: grid;
        place-items: center;
        gap: 14px;
        height: 100vh;
        align-content: center;
        color: #6b7592;
      }
      .bootSpinner {
        width: 36px;
        height: 36px;
        border: 4px solid #dcdcf5;
        border-top-color: #5b5bf0;
        border-radius: 50%;
        animation: bootSpin 0.9s linear infinite;
      }
      @keyframes bootSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bootSplash">
        <div class="bootSpinner"></div>
        Gezinsbudget wordt geladen…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
